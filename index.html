    <script>
      // Completely neutralize Vite HMR WebSocket connection errors in sandbox iframe environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '').toLowerCase();
            if (
              urlStr.includes('vite') ||
              urlStr.includes('hmr') ||
              urlStr.includes('/@vite') ||
              urlStr.includes('websocket') ||
              urlStr.includes('ais-dev') ||
              urlStr.includes('europe-west2.run.app')
            ) {
              const dummy = {
                url: String(url),
                readyState: 1, // OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {},
                addEventListener: function(event, cb) {
                  if (event === 'open') {
                    setTimeout(() => {
                      try {
                        if (typeof cb === 'function') cb({ type: 'open' });
                        if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
                      } catch {}
                    }, 50);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              return dummy;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = RealWebSocket.CONNECTING;
          window.WebSocket.OPEN = RealWebSocket.OPEN;
          window.WebSocket.CLOSING = RealWebSocket.CLOSING;
          window.WebSocket.CLOSED = RealWebSocket.CLOSED;
        }

        const isViteMessage = (args) => {
          try {
            return args.some(a => {
              if (typeof a === 'string') {
                const s = a.toLowerCase();
                return s.includes('[vite]') || s.includes('websocket') || s.includes('failed to connect to websocket');
              }
              if (a && typeof a === 'object') {
                const s = String(a.message || a.reason || '').toLowerCase();
                return s.includes('[vite]') || s.includes('websocket');
              }
              return false;
            });
          } catch {
            return false;
          }
        };

        ['log', 'info', 'warn', 'error', 'debug'].forEach(method => {
          const original = console[method];
          console[method] = function(...args) {
            if (isViteMessage(args)) return;
            original.apply(console, args);
          };
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const msg = String(event.reason.message || event.reason || '').toLowerCase();
            if (msg.includes('websocket') || msg.includes('[vite]')) {
              event.preventDefault();
            }
          }
        });

        window.addEventListener('error', function(event) {
          if (event) {
            const msg = String(event.message || '').toLowerCase();
            if (msg.includes('[vite]') || msg.includes('websocket')) {
              event.preventDefault();
              event.stopPropagation();
            }
          }
        }, true);
      })();
    </script>
