    <meta property="og:title" content="Kroma Crypto Wallet & Exchange" />
    <meta property="og:description" content="A high-performance crypto wallet and digital asset exchange featuring real-time spot trading, order book matching, multi-network custody, P2P marketplace, yield earn, and advanced security." />
    <meta property="og:type" content="website" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0B0F19" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate icon" href="/favicon.ico" />

    <script>
      // Gracefully silence Vite HMR WebSocket connection errors in AI Studio iframe environment
      (function() {
        const hasVite = (args) => {
          try {
            return args.some(a => {
              if (typeof a === 'string') {
                const s = a.toLowerCase();
                return s.includes('[vite]') || s.includes('websocket') || s.includes('failed to connect to websocket');
              }
              if (a && typeof a === 'object') {
                const s = String(a.message || a.reason || '').toLowerCase();
                return s.includes('[vite]') || s.includes('websocket');
              }
              return false;
            });
          } catch {
            return false;
          }
        };

        ['log', 'info', 'warn', 'error', 'debug'].forEach(method => {
          const original = console[method];
          console[method] = function(...args) {
            if (hasVite(args)) return;
            original.apply(console, args);
          };
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const msg = String(event.reason.message || event.reason || '').toLowerCase();
            if (msg.includes('websocket') || msg.includes('[vite]')) {
              event.preventDefault();
            }
          }
        });

        window.addEventListener('error', function(event) {
          if (event) {
            const msg = String(event.message || '').toLowerCase();
            if (msg.includes('[vite]') || msg.includes('websocket')) {
              event.preventDefault();
              event.stopPropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
