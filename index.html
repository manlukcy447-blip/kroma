    <script>
      // Gracefully handle Vite HMR WebSocket connection logs in AI Studio preview iframe
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].toLowerCase().includes('websocket'))) {
            console.warn(...args);
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && typeof event.reason.message === 'string' && (event.reason.message.includes('WebSocket') || event.reason.message.includes('[vite]'))) {
            event.preventDefault();
          }
        });
      })();
    </script>
