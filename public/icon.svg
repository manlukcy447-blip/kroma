<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.8" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.25" stroke-dasharray="8 12" />

  <!-- Shield Shape / Outer Geometry -->
  <path d="M256 96 L376 160 V280 C376 348 324 404 256 424 C188 404 136 348 136 280 V160 Z"
        fill="#0D1527" stroke="url(#primaryGrad)" stroke-width="6" stroke-linejoin="round" opacity="0.9" />

  <!-- Kroma Geometric "K" / Gem Emblem -->
  <!-- Vertical Pillar -->
  <rect x="196" y="184" width="28" height="144" rx="14" fill="url(#primaryGrad)" filter="url(#glow)" />
  <rect x="196" y="184" width="28" height="144" rx="14" fill="url(#primaryGrad)" />

  <!-- Upper Diagonal Wing -->
  <path d="M236 256 L308 184 C314 178 324 182 324 191 L324 200 C324 206 321 212 316 217 L256 276 Z"
        fill="url(#accentGrad)" filter="url(#glow)" />
  <path d="M236 256 L308 184 C314 178 324 182 324 191 L324 200 C324 206 321 212 316 217 L256 276 Z"
        fill="url(#accentGrad)" />

  <!-- Lower Diagonal Wing -->
  <path d="M246 250 L318 322 C323 327 323 335 318 340 L310 348 C305 353 297 353 292 348 L226 282 Z"
        fill="url(#primaryGrad)" filter="url(#glow)" />
  <path d="M246 250 L318 322 C323 327 323 335 318 340 L310 348 C305 353 297 353 292 348 L226 282 Z"
        fill="url(#primaryGrad)" />

  <!-- Center Diamond Spark -->
  <polygon points="256,236 268,256 256,276 244,256" fill="#FFFFFF" opacity="0.95" />
</svg>
